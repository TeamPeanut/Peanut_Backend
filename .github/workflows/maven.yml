name: Build, Test and Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare application.properties
        run: |
          mkdir config
          echo "${{ secrets.PEANUT_APP_PROPERTIES }}" > config/application.properties
          
      - name: Prepare Firebase JSON
        run: |
          mkdir -p src/main/resources/firebase
          printf "%s" "${{ secrets.PEANUT_FIREBASE_CREDENTIALS }}" > src/main/resources/firebase/peanut-bc734-firebase-adminsdk-bsc10-1d0f1c01e4.json

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare application.properties
        run: |
          mkdir config
          echo "${{ secrets.PEANUT_APP_PROPERTIES }}" > config/application.properties
          
      - name: Prepare Firebase JSON
        run: |
          mkdir -p src/main/resources/firebase
          printf "%s" "${{ secrets.PEANUT_FIREBASE_CREDENTIALS }}" > src/main/resources/firebase/peanut-bc734-firebase-adminsdk-bsc10-1d0f1c01e4.json

      - name: Run tests
        run: |
          mvn test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare application.properties
        run: |
          mkdir config
          echo "${{ secrets.PEANUT_APP_PROPERTIES }}" > config/application.properties
          
      - name: Prepare Firebase JSON
        run: |
          mkdir -p src/main/resources/firebase
          printf "%s" "${{ secrets.PEANUT_FIREBASE_CREDENTIALS }}" > src/main/resources/firebase/peanut-bc734-firebase-adminsdk-bsc10-1d0f1c01e4.json

      - name: web docker build and push
        run: |
          docker login -u ${{ secrets.PEANUT_DOCKER_REPO }} -p ${{ secrets.PEANUT_DOCKER_KEY }}
          docker build -t ${{ secrets.PEANUT_DOCKER_REPO }}/peanut-backend:latest .
          docker push ${{ secrets.PEANUT_DOCKER_REPO }}/peanut-backend

      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PEANUT_HOST }}
          username: ${{ secrets.PEANUT_USERNAME }}
          password: ${{ secrets.PEANUT_SSH_PRIVATE_KEY }}
          script: |
            docker stop peanut-backend || true
            docker rm peanut-backend || true
            docker pull ${{ secrets.PEANUT_DOCKER_REPO }}/peanut-backend:latest
            docker run -d -p 8080:80 --net paddo --name peanut-backend ${{ secrets.PEANUT_DOCKER_REPO }}/peanut-backend:latest
